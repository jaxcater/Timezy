# xcodegen spec — chạy `xcodegen generate` trên Mac để sinh .xcodeproj
name: Timezy
options:
  bundleIdPrefix: com.timezy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
targets:
  Timezy:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timezy.app
        PRODUCT_NAME: Timezy
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
schemes:
  Timezy:
    build:
      targets:
        Timezy: all
    run:
      config: Debug
    archive:
      config: Release
